; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Source files live in Main/ (C++ port of the original .ino sketch)
src_dir = Main

[env:giga_r1_m7]
platform = ststm32
board = giga_r1_m7
framework = arduino
upload_protocol = dfu
monitor_port = COM4
; Skip the pre-upload serial flush. When the GIGA is already in bootloader mode
; (double-tapped reset, or a crashed sketch), its COM port can't be opened and the
; flush aborts the upload with "Cannot configure port". dfu-util finds the board
; by USB ID, so the flush isn't needed; the 1200bps reset still runs.
board_upload.disable_flushing = true

lib_deps =
    sparkfun/SparkFun I2C Mux Arduino Library @ ^1.0.3
    pololu/VL53L0X @ ^1.3.1
    adafruit/Adafruit TCS34725 @ ^1.4.4
    adafruit/Adafruit Motor Shield V2 Library @ ^1.1.3
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BNO055 @ ^1.6.4
    einararnason/ArduinoQueue @ ^1.2.5
    janelia-arduino/Vector @ ^1.4.0
    arduino-libraries/Stepper @ ^1.1.3
    arduino-libraries/LiquidCrystal @ ^1.0.7
